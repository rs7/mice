<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Радиоприёмник</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
  :root{
    --bg:#161311; --wood:#3b2a20; --wood2:#241914; --cream:#d6c7a7;
    --ink:#17130f; --glow:#f2d487; --muted:#8f816c;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:grid; place-items:center; min-height:100%;
    background:
      radial-gradient(circle at 50% 20%, #30251e 0, #171310 47%, #0d0b0a 100%);
    font-family: Georgia, "Times New Roman", serif;
    color:var(--cream); padding:24px;
  }
  .radio{
    width:min(760px, 94vw);
    background:
      linear-gradient(90deg, rgba(255,255,255,.035), transparent 15%, rgba(0,0,0,.16) 70%),
      linear-gradient(#493428,#2a1d17);
    border:1px solid #6a4d3a; border-radius:18px;
    box-shadow:0 30px 80px #0009, inset 0 1px #ffffff16, inset 0 -8px 20px #0005;
    padding:24px;
  }
  .top{display:flex; gap:20px; align-items:stretch; flex-wrap:wrap}
  .speaker{
    flex:1 1 260px; min-height:230px; border-radius:14px;
    background:
      radial-gradient(circle, #211b17 0 2px, transparent 2.6px) 0 0/11px 11px,
      #171311;
    border:10px solid #271c16; box-shadow:inset 0 0 30px #000;
  }
  .panel{
    flex:1 1 300px; background:#1b1714; border:1px solid #66523f;
    border-radius:12px; padding:18px; box-shadow:inset 0 0 28px #0008;
  }
  .brand{font-size:12px; letter-spacing:.28em; color:#877967; margin-bottom:12px}
  .dial{
    background:#c9b98f; color:#201b15; border-radius:5px; padding:12px 14px 8px;
    box-shadow:inset 0 0 18px #5f523c66, 0 1px #fff2;
  }
  .freq{font-family:"Courier New", monospace; font-weight:bold; font-size:40px; line-height:1}
  .mhz{font:12px/1.2 Arial,sans-serif; letter-spacing:.16em}
  .scale{position:relative;height:46px;margin-top:12px;border-top:1px solid #544936}
  .ticks{
    position:absolute; inset:5px 0 0;
    background:repeating-linear-gradient(90deg,#544936 0 1px,transparent 1px 24px);
    opacity:.85
  }
  .needle{
    position:absolute; top:0; bottom:0; width:2px; background:#7b1f15;
    left:50%; box-shadow:0 0 6px #8b2419;
    transition:left .05s linear;
  }
  .station{
    min-height:28px; margin-top:11px; font-family:"Courier New", monospace;
    letter-spacing:.18em; font-size:18px; color:#5e523d;
  }
  .station.on{color:#6f2a1b; text-shadow:0 0 8px #a85f3a66}
  .controls{margin-top:18px}
  input[type=range]{width:100%; accent-color:#9a7f59}
  .row{display:flex; align-items:center; justify-content:space-between; gap:15px; margin-top:16px}
  button{
    appearance:none; border:1px solid #8f7558; background:#2b211b; color:#dbc9a7;
    border-radius:999px; padding:10px 20px; font:700 13px Arial,sans-serif;
    letter-spacing:.08em; cursor:pointer; box-shadow:inset 0 1px #fff1;
  }
  button.active{background:#5c4634}
  .lamp{width:10px;height:10px;border-radius:50%;background:#3a3026;box-shadow:inset 0 0 3px #000}
  .lamp.on{background:#cf9e58;box-shadow:0 0 11px #d9a761}
  .hint{font:12px/1.5 Arial,sans-serif;color:#877a69;text-align:right}
  .footer{margin-top:18px;font:11px Arial,sans-serif;color:#746858;letter-spacing:.08em}

  .investigation-wrap{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:64px;
    height:64px;
    overflow:visible;
    opacity:0;
    pointer-events:none;
    margin-top:17px;
  }
  .investigation-wrap.visible{
    opacity:1;
    pointer-events:auto;
  }
  .investigation-link{
    position:relative;
    z-index:2;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:44px;
    padding:11px 22px;
    border:1px solid #8f7558;
    border-radius:999px;
    background:#2b211b;
    color:#dbc9a7;
    text-decoration:none;
    font:700 13px Arial,sans-serif;
    letter-spacing:.06em;
    box-shadow:inset 0 1px #fff1;
    opacity:0;
    transform:translateY(8px) scale(.97);
    filter:blur(3px);
  }
  .investigation-wrap.visible .investigation-link{
    animation:linkAppear .8s ease forwards;
  }
  .investigation-wrap.evaporate{
    opacity:1;
    pointer-events:none;
  }
  .investigation-wrap.evaporate .investigation-link{
    animation:linkEvaporate .72s ease forwards;
  }
  .investigation-wrap::before,
  .investigation-wrap::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:190px;
    height:46px;
    border:1px solid rgba(219,201,167,.45);
    border-radius:999px;
    transform:translate(-50%,-50%) scale(.7);
    opacity:0;
    pointer-events:none;
  }
  .investigation-wrap.evaporate::before{
    animation:rippleOut .72s ease-out forwards;
  }
  .investigation-wrap.evaporate::after{
    animation:rippleOut .72s .10s ease-out forwards;
  }
  @keyframes linkAppear{
    from{opacity:0;transform:translateY(8px) scale(.97);filter:blur(3px)}
    to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
  }
  @keyframes linkEvaporate{
    0%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
    55%{opacity:.45;transform:translateY(-2px) scale(1.015);filter:blur(2px)}
    100%{opacity:0;transform:translateY(-7px) scale(1.04);filter:blur(7px)}
  }
  @keyframes rippleOut{
    0%{opacity:.5;transform:translate(-50%,-50%) scale(.72)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.38)}
  }

  @media(max-width:620px){
    body{padding:12px}
    .radio{padding:15px}
    .speaker{min-height:155px}
    .freq{font-size:34px}
  }
</style>
</head>
<body>
<div class="radio">
  <div class="top">
    <div class="speaker" aria-hidden="true"></div>
    <div class="panel">
      <div class="brand">SHORTWAVE RECEIVER</div>
      <div class="dial">
        <div><span id="freq" class="freq">97.1</span> <span class="mhz">MHz</span></div>
        <div class="scale">
          <div class="ticks"></div>
          <div id="needle" class="needle"></div>
        </div>
        <div id="station" class="station">—</div>
      </div>

      <div class="controls">
        <input id="tuner" type="range" min="87.5" max="108.0" value="97.1" step="0.1" aria-label="Частота">
        <div class="row">
          <div style="display:flex;align-items:center;gap:9px">
            <div id="lamp" class="lamp"></div>
            <button id="power">ВКЛЮЧИТЬ</button>
          </div>
          <div class="hint">НАСТРОЙКА ЧАСТОТЫ</div>
        </div>
      </div>
    </div>
  </div>
  <div class="footer">FM · MANUAL TUNING</div>
  <div id="investigationWrap" class="investigation-wrap" aria-hidden="true">
    <button id="investigationLink" class="investigation-link" type="button">Продолжить расследование</button>
  </div>
</div>

<script>
(() => {
  // Менять нужную частоту можно здесь:
  const TARGET = 103.7;
  const RANGE_NEAR = 1.1;
  const RANGE_LOCK = 0.16;

  const tuner = document.getElementById('tuner');
  const freqEl = document.getElementById('freq');
  const needle = document.getElementById('needle');
  const station = document.getElementById('station');
  const powerBtn = document.getElementById('power');
  const lamp = document.getElementById('lamp');
  const signal = document.getElementById('signal');
  const investigationWrap = document.getElementById('investigationWrap');
  let investigationTimer = null;
  let investigationShown = false;
  let evaporationTimer = null;

  let ctx, noiseSource, noiseGain, signalGain, powered = false;

  function makeNoiseBuffer(ctx) {
    const seconds = 3;
    const buffer = ctx.createBuffer(1, ctx.sampleRate * seconds, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i=0;i<data.length;i++) {
      // белый шум + редкие лёгкие импульсы
      let x = Math.random()*2-1;
      if (Math.random() < 0.0007) x *= 3.4;
      data[i] = Math.max(-1, Math.min(1, x));
    }
    return buffer;
  }

  async function initAudio(){
    if(ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();

    noiseSource = ctx.createBufferSource();
    noiseSource.buffer = makeNoiseBuffer(ctx);
    noiseSource.loop = true;

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1800;
    filter.Q.value = 0.55;

    noiseGain = ctx.createGain();
    signalGain = ctx.createGain();

    noiseSource.connect(filter).connect(noiseGain).connect(ctx.destination);

    const media = ctx.createMediaElementSource(signal);
    media.connect(signalGain).connect(ctx.destination);

    noiseSource.start();
    noiseGain.gain.value = 0;
    signalGain.gain.value = 0;
  }


  function onExactTarget(){
    const f = parseFloat(tuner.value);
    return powered && Math.abs(f - TARGET) < 0.001;
  }

  function hideInvestigation(){
    if(investigationTimer){
      clearTimeout(investigationTimer);
      investigationTimer = null;
    }

    if(evaporationTimer){
      clearTimeout(evaporationTimer);
      evaporationTimer = null;
    }

    if(investigationShown || investigationWrap.classList.contains('visible')){
      investigationShown = false;
      investigationWrap.classList.remove('visible');
      investigationWrap.classList.add('evaporate');
      investigationWrap.setAttribute('aria-hidden','true');

      evaporationTimer = setTimeout(() => {
        investigationWrap.classList.remove('evaporate');
        evaporationTimer = null;
      }, 760);
    } else {
      investigationWrap.classList.remove('visible','evaporate');
      investigationWrap.setAttribute('aria-hidden','true');
    }
  }

  function scheduleInvestigation(){
    if(!onExactTarget()){
      hideInvestigation();
      return;
    }

    if(investigationShown || investigationTimer) return;

    investigationTimer = setTimeout(() => {
      investigationTimer = null;

      if(!onExactTarget()) return;

      investigationShown = true;
      investigationWrap.classList.remove('evaporate');
      investigationWrap.classList.add('visible');
      investigationWrap.setAttribute('aria-hidden','false');
    }, 3000);
  }

  function updateMix(){
    const f = parseFloat(tuner.value);
    freqEl.textContent = f.toFixed(1);

    const pct = (f - 87.5) / (108.0 - 87.5) * 100;
    needle.style.left = pct + '%';

    if(!powered || !ctx) {
      station.textContent = '—';
      station.classList.remove('on');
      hideInvestigation();
      return;
    }

    const d = Math.abs(f - TARGET);
    let n = 0.34, s = 0;

    if(d < RANGE_NEAR){
      const closeness = 1 - d / RANGE_NEAR;
      n = 0.34 * (1 - 0.86 * closeness);
      s = 0.55 * Math.pow(closeness, 1.5);
    }

    if(d <= RANGE_LOCK){
      station.textContent = 'СЮЖЕТ';
      station.classList.add('on');
      n = 0.018;
      s = 0.78;
    } else {
      station.textContent = d < .55 ? '•••' : '—';
      station.classList.remove('on');
    }

    noiseGain.gain.setTargetAtTime(n, ctx.currentTime, .05);
    signalGain.gain.setTargetAtTime(s, ctx.currentTime, .05);
    scheduleInvestigation();
  }

  tuner.addEventListener('input', updateMix);

  document.getElementById('investigationLink').addEventListener('click', () => {
    window.open('../blog/', '_blank', 'noopener,noreferrer');
  });

  powerBtn.addEventListener('click', async () => {
    await initAudio();
    if(ctx.state === 'suspended') await ctx.resume();

    powered = !powered;
    powerBtn.textContent = powered ? 'ВЫКЛЮЧИТЬ' : 'ВКЛЮЧИТЬ';
    powerBtn.classList.toggle('active', powered);
    lamp.classList.toggle('on', powered);

    if(powered){
      // Браузеры разрешают воспроизведение после клика пользователя.
      try { await signal.play(); } catch(e) {}
    } else {
      hideInvestigation();
      signal.pause();
      noiseGain.gain.setTargetAtTime(0, ctx.currentTime, .03);
      signalGain.gain.setTargetAtTime(0, ctx.currentTime, .03);
    }
    updateMix();
  });

  updateMix();
})();
</script>
