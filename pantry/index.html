<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Найди предмет</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="scene-viewport">
      <div class="scene-stage">
        <img class="scene-image" src="assets/scene.png" usemap="#scene-map" hidden>
        <map name="scene-map" id="scene-map"></map>
        <svg class="debug-overlay" hidden></svg>
        <div class="gui-layer" id="gui-layer">
          <div class="progress-counter" hidden></div>
          <div class="lives-counter" hidden></div>
          <div class="hint-panel" hidden></div>
        </div>

        <div class="modal-layer" hidden>
          <div class="modal">
            <h2 class="modal-title" hidden></h2>
            <div class="modal-text"></div>
            <div class="modal-actions">
              <button class="modal-restart" type="button" hidden></button>
              <button class="modal-next" type="button"></button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <audio class="background-music" src="assets/music.mp3" loop preload="auto"></audio>
    <audio class="outro-music" src="assets/finish.mp3" preload="auto"></audio>
    <script type="module" src="./game.js"></script>
  </body>
</html>
