<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кладовая ароматов</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="scene-viewport">
      <div class="scene-stage">
        <img class="scene-image" src="assets/scene.png" usemap="#scene-map" hidden>
        <map name="scene-map" id="scene-map"></map>
        <svg class="debug-overlay" hidden></svg>
        <div class="gui-layer" id="gui-layer">
          <div class="progress-counter" hidden></div>
          <div class="lives-counter" hidden></div>
          <div class="hint-panel" hidden></div>
        </div>

        <div class="modal-layer" hidden>
          <div class="modal">
            <h2 class="modal-title" hidden></h2>
            <div class="modal-text"></div>
            <div class="modal-actions"></div>
          </div>
        </div>
      </div>
    </main>

    <template id="outro-note-template">
      <p data-message></p>
      <p><em data-signature></em></p>
      <hr>
      <p data-afterword></p>
    </template>

    <template id="modal-button-template">
      <button class="modal-button" type="button" tabindex="-1"></button>
    </template>

    <template id="life-icon-template">
      <img class="lives-icon" src="assets/heart.svg" alt="" draggable="false">
    </template>

    <template id="progress-icon-template">
      <img class="progress-icon" src="assets/star-outline.svg" alt="" draggable="false">
    </template>

    <audio class="background-music" src="assets/background.mp3" loop preload="auto"></audio>
    <audio class="outro-music" src="assets/outro.mp3" loop preload="auto"></audio>

    <script type="module" src="./scripts/game.js"></script>
  </body>
</html>
