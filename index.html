<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Найди предмет</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="scene-viewport">
      <img class="scene-image" src="assets/scene.png" alt="Сцена для поиска предметов" usemap="#scene-map" hidden>
      <map name="scene-map" id="scene-map"></map>
      <div class="gui-layer" id="gui-layer">
        <div class="lives-counter" role="status" aria-live="polite" aria-atomic="true" hidden></div>
        <div class="hint-panel" role="status" aria-live="polite" hidden></div>
      </div>
    </main>

    <dialog class="modal" aria-labelledby="modal-text">
      <p class="modal-text" id="modal-text"></p>
      <button class="modal-next" type="button" autofocus></button>
    </dialog>

    <script type="module" src="./game.js"></script>
  </body>
</html>
